[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ragent-agent-service"
version = "0.1.0"
description = "Python Agent runtime for Ragent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.141,<1.0",
    "langchain-core>=1.5,<2.0",
    "langgraph>=1.2,<2.0",
    "llama-index-core>=0.12,<1.0",
    "pydantic-settings>=2.14,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
    "ruff>=0.14,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragent_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
